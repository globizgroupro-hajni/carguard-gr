<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ευχαριστούμε! — CARGUARD®</title>
<meta name="robots" content="noindex">
<style>
:root{--red:#e1121d;--red2:#ff2b2b;--bg:#0b0b0d;--bg2:#141417;--line:#26262b;--tx:#f3f3f5;--mut:#a7a7ad}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:480px;width:100%;background:radial-gradient(700px 360px at 50% 0,rgba(225,18,29,.3),transparent 60%),var(--bg2);border:1px solid var(--line);border-radius:20px;padding:44px 32px;text-align:center}
img.logo{height:40px;margin:0 auto 24px;display:block}
.check{font-size:52px;margin-bottom:16px}
h1{font-size:26px;font-weight:900;margin-bottom:12px}
p.sub{color:var(--mut);font-size:16px;margin-bottom:30px}
.btn{display:inline-block;background:var(--red);color:#fff;font-weight:800;text-decoration:none;padding:16px 30px;border-radius:12px;font-size:17px;box-shadow:0 8px 24px rgba(225,18,29,.35);transition:.15s}
.btn:hover{background:#ff1f2b;transform:translateY(-2px)}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="assets/logo.png" alt="CARGUARD®">
  <div class="check">✅</div>
  <h1>Ευχαριστούμε για την πληρωμή!</h1>
  <p class="sub">Η παραγγελία σας ελήφθη με επιτυχία. Θα επικοινωνήσουμε σύντομα μαζί σας με τα στοιχεία αποστολής.</p>
  <a class="btn" href="https://carguard.gr/">www.carguard.gr</a>
</div>
</body>
</html>
